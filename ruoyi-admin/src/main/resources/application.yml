# 项目相关配置
ruoyi:
  # 系统名称
  name: 教学资源管理系统
  # 当前版本
  version: 3.9.1
  # 版权年份
  copyrightYear: 2026
  # 文件上传目录（Windows 示例：D:/ruoyi/uploadPath，Linux 示例：/home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 是否开启 IP 归属地解析
  addressEnabled: false
  # 验证码类型：math 数字计算，char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器 HTTP 端口，默认 8080
  port: 8080
  servlet:
    # 应用访问路径
    context-path: /
  tomcat:
    # URI 编码
    uri-encoding: UTF-8
    # 连接队列长度
    accept-count: 1000
    threads:
      # Tomcat 最大线程数
      max: 800
      # Tomcat 初始化线程数
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（分钟）
    lockTime: 10

# Spring 配置
spring:
  messages:
    # 国际化资源路径
    basename: i18n/messages
  profiles:
    active: druid
  servlet:
    multipart:
      # 单个文件上传大小
      max-file-size: 10MB
      # 单次请求总上传大小
      max-request-size: 20MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    redis:
      # Redis 地址
      host: localhost
      # Redis 端口
      port: 6379
      # Redis 数据库索引
      database: 0
      # Redis 密码
      password:
      # Redis 超时时间
      timeout: 10s
      lettuce:
        pool:
          # 最小空闲连接
          min-idle: 0
          # 最大空闲连接
          max-idle: 8
          # 最大活动连接
          max-active: 8
          # 最大等待时间（负数表示无限制）
          max-wait: -1ms

# Token 配置
token:
  # 请求头名称
  header: Authorization
  # 密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 有效期（分钟）
  expireTime: 30

# MyBatis 配置
mybatis:
  # 实体别名包
  typeAliasesPackage: com.ruoyi.**.domain
  # Mapper XML 路径
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 全局配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper 分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '教学资源接口'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1

# XSS 过滤配置
xss:
  # 过滤开关
  enabled: true
  # 排除路径（多个使用英文逗号分隔）
  excludes: /system/notice
  # 需要过滤的路径
  urlPatterns: /system/*,/monitor/*,/tool/*
